name: Validate & build APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  GODOT_TAG: 4.4.1-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install display + software GPU (for real rendering in CI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri libvulkan1 > /dev/null

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip && rm Godot_v${GODOT_TAG}_linux.x86_64.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q Godot_v${GODOT_TAG}_export_templates.tpz && rm Godot_v${GODOT_TAG}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: |
          timeout 300 ~/godot/godot --headless --path . --import 2>&1 | tee import.log || true

      - name: Smoke test (real rendering, autopilot through every game, screenshots)
        run: |
          mkdir -p shots
          set +e
          timeout 900 xvfb-run -a -s "-screen 0 1280x1024x24" ~/godot/godot --path . --resolution 540x960 \
            --audio-driver Dummy -- --smoke --smoke-out=$PWD/shots 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          echo "exit code: $code"
          echo "===== errors ====="
          grep -nE "SCRIPT ERROR|Parse Error|Compile Error|SHADER ERROR|ERROR:|Invalid call|Invalid access|Nonexistent function" smoke.log import.log | grep -v "ALSA\|PulseAudio\|Vulkan\|vkCreate\|VK_\|xdg\|dbus\|Failed to connect" | head -150 > errors.txt
          cat errors.txt
          if [ -s errors.txt ]; then echo "Errors found"; exit 1; fi
          grep -q "SMOKE TEST PASSED" smoke.log || { echo "Smoke test did not finish"; exit 1; }

      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            shots/
            smoke.log
            import.log
            errors.txt
          if-no-files-found: ignore

      - name: Set up Java 17
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Export debug APK
        if: always()
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          mkdir -p ~/.config/godot build
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.4.tres
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          timeout 600 ~/godot/godot --headless --path . --export-debug "Android" build/ArcadeRush-debug.apk 2>&1 | tee export.log
          ls -la build/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeRush-debug-apk
          path: |
            build/ArcadeRush-debug.apk
            export.log
          if-no-files-found: warn
